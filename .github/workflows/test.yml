name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./... && go vet -tags e2e ./...
      - run: go test -race ./...

  e2e-pebble:
    name: Issuance (Pebble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
      - run: go test -tags e2e -count=1 -v ./internal/e2e

  distribution:
    name: Distribution (containers, ssh, rrsync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: tests/compose/run.sh
